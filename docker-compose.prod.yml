# Production deployment for the Billiard Tournament Manager.
#
# Run with:
#   cp .env.prod.example .env.prod   # then edit secrets
#   docker-compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Exposed surface: ONLY the frontend nginx on ${FRONTEND_PORT:-80}.
# The nginx container:
#   - serves the compiled React SPA
#   - proxies /api/* to the backend (backend is NOT exposed to the host)
# The PostgreSQL database is internal to the compose network (no host port).
#
# For Kubernetes instead, see the README's "Kubernetes Deployment (Helm)" section.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billiard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: billiard_tournaments
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billiard} -d billiard_tournaments"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-billiard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      DB_NAME: billiard_tournaments
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.prod}
      FRONTEND_KEY: ${FRONTEND_KEY:?set FRONTEND_KEY in .env.prod}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/tournaments',{headers:{'X-App-Key':process.env.FRONTEND_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Baked into the JS bundle at build time; MUST equal the backend
        # FRONTEND_KEY (the API rejects every request without this header).
        VITE_APP_KEY: ${FRONTEND_KEY:?set FRONTEND_KEY in .env.prod}
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Injected into nginx.conf by envsubst at container start: the /api proxy
      # destination. Defaults to the internal backend service. Override with
      # BACKEND_API_URL to point at a backend reachable only on a non-public URL
      # (e.g. a private-network/VPN address the frontend host can reach).
      VITE_API_URL: ${BACKEND_API_URL:-http://backend:3001}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data_prod: